<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Email images{% endblock %}</title>
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --line: #d9dde5; --bg: #f5f6f8; --accent: #1f5fbf; --bad: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 1.5rem; align-items: center; padding: .75rem 1.5rem; background: #fff; border-bottom: 1px solid var(--line); }
  header strong { margin-right: auto; }
  header a, header button { color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
  main { max-width: 1100px; margin: 1.5rem auto; padding: 0 1.5rem; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; } h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
  label { display: block; font-weight: 600; margin: .75rem 0 .25rem; }
  .hint { color: var(--muted); font-size: .88rem; font-weight: 400; }
  input[type=text], input[type=password], input[type=number], select { width: 100%; padding: .45rem .55rem; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  input[type=color] { width: 4rem; height: 2.2rem; border: 1px solid var(--line); border-radius: 6px; }
  button, .button { display: inline-block; padding: .5rem 1rem; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; text-decoration: none; }
  button.secondary, .button.secondary { background: #fff; color: var(--accent); }
  button.danger { background: #fff; color: var(--bad); border-color: var(--bad); }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; } .row > * { flex: 1; min-width: 10rem; }
  .flash { background: #fff8e1; border: 1px solid #f0d58a; border-radius: 6px; padding: .6rem .9rem; margin-bottom: 1rem; }
  .errors { color: var(--bad); margin: .5rem 0; padding-left: 1.2rem; }
  table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .thumb { width: 150px; border-radius: 4px; display: block; }
  .inline { display: inline; }
  textarea { width: 100%; font: 13px/1.4 ui-monospace, monospace; padding: .5rem; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
{% if g.user %}
<header>
  <strong>Email images</strong>
  <a href="{{ url_for('admin.index') }}">Templates</a>
  {% if g.user.is_admin %}<a href="{{ url_for('admin.users') }}">Users</a><a href="{{ url_for('admin.fonts') }}">Fonts</a>{% endif %}
  <a href="{{ url_for('admin.account') }}">{{ g.user.username }}</a>
  <form class="inline" method="post" action="{{ url_for('admin.logout') }}">
    <input type="hidden" name="csrf" value="{{ session.csrf }}"><button>Sign out</button>
  </form>
</header>
{% endif %}
<main>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
